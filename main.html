<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Royal Blue  Theatre</title>
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="#" class="brand">Royal Blue </a>
            <a href="#seats">Event Tickets</a>
            <a href="#cart" class="nav-cart">Cart (<span id="nav-cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="event-bar">
        <p class="event-label">Coming Soon</p>
        <h1>Nina Simone at Royal Blue </h1>
        <p class="event-meta">Friday October 17th, 19:30, Hall A</p>
        <p class="seat-summary" id="seat-summary"></p>
    </section>
    
    <main class="main-layout">
        <section id = "seats">
            <div class="seats-head">
                <h2>Choose Your Seats</h2>
                <div class="map-controls">
                    <button class="control" id="zoom-out" title="Zoom out">-</button>
                    <span class="zoom-level" id="zoom-level">100%</span>
                    <button class="control" id="zoom-in" title="Zoom in">+</button>
                    <button class="control" id="move-left" title="Move left">←</button>
                    <button class="control" id="move-up" title="Move up">↑</button>
                    <button class="control" id="move-down" title="Move down">↓</button>
                    <button class="control" id="move-right" title="Move right">→</button>
                    <button class="control" id="reset-view">Reset view</button>
                </div>
            </div>
            <div class="map-viewport" id="map-viewport" tabindex="0">
                <div class="venue" id="venue"></div>
            </div>
            <ul class="legend" id="legend"></ul>
            <ul class="legend states">
                <li><span class="color-box available"></span> Available</li>
                <li><span class="color-box inspected"></span> Selected</li>
                <li><span class="color-box in-cart"></span> In cart</li>
                <li><span class="color-box sold"></span> Unavailable</li>
            </ul>
        </section>

        <aside class="sidebar">
            <section class="panel">
                <h2>Seat Details</h2>
                <div id="seat-details"></div>
                <button class="btn-primary" id="add-to-cart" disabled>Add to Cart</button>
                <p class="message" id="message"></p>
            </section>

            <section class="panel" id="cart">
                <div class="cart-head">
                    <h2>Cart <span class="count" id="cart-count">0</span></h2>
                    <button class="btn-link" id="clear-cart">Clear all</button>
                </div>
                <ul class="cart-list" id="cart-list"></ul>
                <div class="cart-total">
                    <span>Total</span>
                    <strong id="cart-total">0 AZN</strong>
                </div>
            </section>
        </aside>
    </main>

    <script src="data.js"></script>
    <script src="map.js"></script>
    <script src="script.js"></script>
</body>
</html>
